<header class="bg-slate-800 text-white py-4 px-6 flex justify-between items-center shadow-md">
    <div class="text-2xl font-bold">Todo App</div>
    <nav>
      <ng-container *ngIf="authService.currentUserValue">
        <span class="mr-4">Welcome, {{ authService.currentUserValue.username }}</span>
        <button 
          (click)="logout()" 
          class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition-colors">
          Logout
        </button>
      </ng-container>
    </nav>
  </header>
