<p>login works!</p>
<div class="flex justify-center items-center min-h-[80vh]">
    <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-slate-800">Login</h2>
      
      <div *ngIf="error" class="bg-red-100 text-red-700 p-3 rounded-md mb-6">
        {{ error }}
      </div>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-6">
          <label for="email" class="block mb-2 text-gray-600 font-medium">Email</label>
          <input 
            type="email" 
            id="email"
            formControlName="email"
            placeholder="Enter your email"
            class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" 
               class="text-red-500 text-sm mt-1">
            Please enter a valid email
          </div>
        </div>
        
        <div class="mb-6">
          <label for="password" class="block mb-2 text-gray-600 font-medium">Password</label>
          <input 
            type="password" 
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" 
               class="text-red-500 text-sm mt-1">
            Password must be at least 6 characters
          </div>
        </div>
        
        <div class="flex justify-between mt-8">
          <button 
            type="submit" 
            [disabled]="loginForm.invalid || isSubmitting"
            class="px-6 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
          >
            {{ isSubmitting ? 'Logging in...' : 'Login' }}
          </button>
          
          <button 
            type="button" 
            (click)="goToSignup()" 
            class="px-6 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 transition-colors"
          >
            Sign Up
          </button>
        </div>
      </form>
    </div>
  </div>
